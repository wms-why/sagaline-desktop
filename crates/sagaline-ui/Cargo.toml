[package]
name = "sagaline-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Sagaline desktop UI: gpui-kit views over the sagaline-core story graph."

[dependencies]
gpui-kit = { workspace = true }
gpui-base = { workspace = true }
gpui-component = { workspace = true }
sagaline-core = { path = "../sagaline-core" }
sagaline-agent = { path = "../sagaline-agent" }
sagaline-store = { path = "../sagaline-store" }
sagaline-bridge = { path = "../sagaline-bridge" }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
secrecy = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"
