[package]
name = "sagaline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Sagaline — open source AI video generator (desktop binary)."

[lib]
name = "sagaline"
path = "src/lib.rs"

[[bin]]
name = "sagaline"
path = "src/main.rs"

[dependencies]
sagaline-core = { path = "../sagaline-core" }
sagaline-agent = { path = "../sagaline-agent" }
sagaline-store = { path = "../sagaline-store" }
sagaline-bridge = { path = "../sagaline-bridge" }
sagaline-providers = { path = "../sagaline-providers" }
sagaline-ui = { path = "../sagaline-ui" }
gpui-kit = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3"
