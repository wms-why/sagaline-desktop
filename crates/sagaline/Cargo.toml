[package]
name = "sagaline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Sagaline — open source AI video generator (desktop binary)."

[lib]
name = "sagaline"
path = "src/lib.rs"

[[bin]]
name = "sagaline"
path = "src/main.rs"

[dependencies]
sagaline-core = { path = "../sagaline-core" }
sagaline-agent = { path = "../sagaline-agent" }
sagaline-keys = { path = "../sagaline-keys" }
sagaline-providers = { path = "../sagaline-providers" }
sagaline-ui = { path = "../sagaline-ui" }
gpui-kit = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
