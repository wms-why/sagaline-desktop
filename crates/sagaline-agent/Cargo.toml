[package]
name = "sagaline-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Sagaline agent loop — OBSERVE → PLAN → ACT → REFLECT, tool registry, event stream."

[dependencies]
sagaline-core = { path = "../sagaline-core" }
sagaline-providers = { path = "../sagaline-providers" }
sagaline-store = { path = "../sagaline-store" }
uuid = { workspace = true }
rusqlite = { workspace = true }
rig-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
mp4 = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
tempfile = "3"
sagaline-bridge = { path = "../sagaline-bridge" }
# Test-only: gives us `TestAppContext` + the `test` attribute
# macro so we can drive a real GPUI scheduler + a real Tokio
# runtime in the same test.
gpui-kit = { workspace = true, features = ["test-support"] }
