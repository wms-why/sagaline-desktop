[workspace]
members = ["crates/sagaline", "crates/sagaline-core", "crates/sagaline-ui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gpui-kit = "0.6"
gpui-base = "0.6"
gpui-component = "0.6"
rust-i18n = "4"
futures = { version = "0.3", features = ["executor"] }

# Domain / persistence
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
