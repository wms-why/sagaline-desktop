[workspace]
members = ["crates/sagaline", "crates/sagaline-core", "crates/sagaline-ui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gpui-kit = "0.6"
gpui-base = "0.6"
gpui-component = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
schemars = "0.8"