[workspace]
members = [
    "crates/sagaline",
    "crates/sagaline-core",
    "crates/sagaline-agent",
    "crates/sagaline-ui",
    "crates/sagaline-store",
    "crates/sagaline-bridge",
    "crates/sagaline-providers",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gpui-kit = "0.6"
gpui-base = "0.6"
gpui-component = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
schemars = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
futures = "0.3"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
async-trait = "0.1"
secrecy = "0.10"
age = { version = "0.11", features = ["armor"] }
toml = "0.8"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rig-core = { version = "=0.42.0", default-features = false, features = ["image", "reqwest", "rustls", "derive"] }
wiremock = "0.6"
# Added for sagaline-store (Phase 1)
refinery = { version = "0.9", features = ["rusqlite-bundled"] }
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
mp4 = "0.14"
